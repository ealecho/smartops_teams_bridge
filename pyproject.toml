[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smartops-teams-bridge"
version = "0.1.0"
description = "Bidirectional Microsoft Teams and Frappe Helpdesk support bridge"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
